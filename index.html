<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Fresh fruit juices, shakes and cold coffee squeezed to order at Azad Juice Corner, opposite Amity University, Mohali.">
<meta name="theme-color" content="#2b1b3d">
<title>Azad Juice Corner | Fresh Juice & Shakes in Mohali</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f1ff;--surface:#fff;--ink:#2b1b3d;--muted:#6b5a80;--line:#ddd3ee;--btn:#2b1b3d;--btn-ink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1126;--surface:#261837;--ink:#f5eefc;--muted:#b7a6cc;--line:#3a2a50;--btn:#ffb627;--btn-ink:#2b1b3d}}
:root[data-theme="dark"]{--bg:#1a1126;--surface:#261837;--ink:#f5eefc;--muted:#b7a6cc;--line:#3a2a50;--btn:#ffb627;--btn-ink:#2b1b3d}
html{scroll-padding-top:110px}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 Outfit,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.05;letter-spacing:-.02em}
a{color:inherit}button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:10px 0 0;background:var(--bg)}
.pill{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:8px 8px 8px 20px}
.logo{font:800 20px Fraunces,serif;text-decoration:none}
.cartbtn{background:var(--btn);color:var(--btn-ink);border:0;border-radius:99px;padding:8px 18px;font-weight:600}
.links{display:flex;gap:22px;overflow-x:auto;padding:10px 4px;scrollbar-width:none}
.links a{text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;padding-bottom:2px;border-bottom:3px solid transparent}
.links a[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
.btn{display:inline-block;background:var(--btn);color:var(--btn-ink);border:0;border-radius:99px;padding:13px 26px;font-weight:600;text-decoration:none}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:30px 0 50px}
.hero h1{font-size:clamp(44px,8.5vw,84px);font-weight:800}
.hero p{max-width:32ch;color:var(--muted);font-size:19px;margin:16px 0 22px}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.sun{width:min(74vw,320px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;transition:background .5s;color:#2b1b3d}
.sun span{font-size:clamp(110px,24vw,160px);line-height:1;transition:transform .35s}
.sun span.pop{transform:scale(1.18) rotate(-8deg)}
.pick{display:flex;gap:10px}
.pick button{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:23px;padding:0}
.pick button[aria-pressed="true"]{border:3px solid var(--ink)}
.cap{text-align:center;min-height:56px}.cap b{font:800 24px Fraunces,serif;display:block}.cap span{color:var(--muted)}
section{padding:40px 0}
h1.pg{font-size:clamp(38px,7vw,62px);font-weight:800}
h2{font-size:clamp(30px,5vw,44px);font-weight:800}
.sub{color:var(--muted);margin:10px 0 24px;max-width:50ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px}
.card h3{font-size:24px;margin-bottom:6px}.card p{margin:0;color:var(--muted);font-size:15px}
.card b{display:block;margin-top:10px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:4px;color:#2b1b3d;background:var(--c)}
.tile .e{font-size:52px;line-height:1.1}.tile h3{font-size:23px;font-weight:600}
.tile p{margin:0;flex:1;font-size:15px;opacity:.8}
.tile .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.tile .price{font:800 22px Fraunces,serif}
.add{width:44px;height:44px;border-radius:50%;border:0;background:#2b1b3d;color:#fff;font-size:24px;line-height:1;padding:0}
.grp{margin:26px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:99px;padding:7px 16px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
textarea{width:100%;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);font:inherit;padding:12px;min-height:70px}
.sel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;margin-top:22px}
.sel h3{font-size:26px}
.post{display:grid;grid-template-columns:130px 1fr;gap:6px 24px;padding:24px 0;border-bottom:1px solid var(--line);text-decoration:none}
.post time{color:var(--muted);padding-top:6px}.post h3{font-size:clamp(24px,4vw,32px);font-weight:600}
.post p{margin:6px 0 0;color:var(--muted)}
.art{max-width:660px}.art h2{font-size:28px;margin:30px 0 8px}.art p{margin:0 0 14px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.gal div{border-radius:28px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--c);color:#2b1b3d;font-weight:600}
.gal span{font-size:64px}
.panel{background:#2b1b3d;color:#f5eefc;border-radius:36px;padding:clamp(26px,5vw,52px);margin-top:20px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .panel{background:#3a2552}}
.panel p{color:#d9cbeb;margin:8px 0}.panel .btn{background:#ffb627;color:#2b1b3d}.panel .ghost{background:transparent;color:#f5eefc;border:1.5px solid #f5eefc}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:20px}
.info div{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px}.info b{display:block;font:800 20px Fraunces,serif;margin-bottom:4px}
footer{padding:28px 0 40px;color:var(--muted);font-size:14px;text-align:center}
dialog{border:0;border-radius:28px;background:var(--surface);color:var(--ink);width:min(440px,92vw);padding:24px}
dialog::backdrop{background:rgba(20,8,32,.6)}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line small{color:var(--muted)}
.q{white-space:nowrap}.q button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.orow{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
input.nm{width:100%;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;padding:10px 12px;margin-top:12px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,80px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;transition:transform .3s;z-index:40}
#toast.on{transform:translate(-50%,0)}
@media (max-width:720px){.hero{grid-template-columns:1fr}.post{grid-template-columns:1fr}.post time{padding:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

{n:"Pomegranate Juice",e:"🍎",g:"Fresh juices",p:100,c:JC,d:"Ruby red, hand-pressed."},
{n:"Sugarcane",e:"🌿",g:"Fresh juices",p:40,c:JC,d:"Pressed with ginger and lemon."},

{n:"Mango Shake",e:"🥭",g:"Shakes and cold coffee",p:90,c:SC,d:"Thick, sweet and sunny."},
{n:"Banana Shake",e:"🍌",g:"Shakes and cold coffee",p:70,c:SC,d:"Smooth and filling."},
{n:"Strawberry Shake",e:"🍓",g:"Shakes and cold coffee",p:90,c:SC,d:"Pink, fruity and cool."},
{n:"Chocolate Shake",e:"🍫",g:"Shakes and cold coffee",p:90,c:SC,d:"Rich cocoa in a glass."},

var FAV=[3,2,7,9];

function tile(i){var m=M[i];return '<div class="tile" style="--c:'+m.c+'"><div class="e">'+m.e+'</div><h3>'+m.n+'</h3><p>'+m.d+'</p><div class="row"><span class="price">'+CUR+m.p+'</span><button class="add" data-add="'+i+'" aria-label="Add '+m.n+'">+</button></div></div>'}

{id:"fresh",t:"Why fresh-pressed beats the packet",d:"Oct 12, 2026",s:"Packaged juice often sits for weeks. Ours is pressed minutes before you drink it.",b:"<p>Heat and storage reduce the vitamin C in juice over time, and many packs add sugar or concentrate. At the corner we press each glass to order, so the colour and flavour you see is the fruit itself.</p><h2>Ask for it your way</h2><p>If you like it sweeter, ask us to add a little honey instead of sugar. If you like it colder, ask for extra ice. You can also set sugar and ice yourself on the Build your drink page.</p><h2>A note on water</h2><p>Juice is a treat, not a replacement for water. Keep a bottle with you and enjoy a glass in between.</p>"},

var V={

+'<section><h2>Explore</h2><div class="cards" style="margin-top:20px"><a class="card" href="#/menu"><h3>Our menu</h3><p>Juices, shakes and cold coffee.</p><b>See the drinks →</b></a><a class="card" href="#/build"><h3>Build your drink</h3><p>Pick a flavour, set sugar and ice.</p><b>Start building →</b></a><a class="card" href="#/about"><h3>About us</h3><p>The story of the stall at Amity’s gate.</p><b>Read our story →</b></a><a class="card" href="#/blog"><h3>Blog</h3><p>Short reads on fruit and health.</p><b>Read the blog →</b></a><a class="card" href="#/gallery"><h3>Gallery</h3><p>Fresh fruit and cold glasses.</p><b>See the photos →</b></a><a class="card" href="#/contact"><h3>Find us</h3><p>Address, timings and WhatsApp.</p><b>Visit us →</b></a></div></section>'

about:function(){return '<section class="art"><h1 class="pg">A regular stop at Amity’s gate</h1><p class="sub">Right opposite Gate 2, Azad Juice Corner is where you stop for a cold glass between classes.</p><h2>Our story</h2><p>We are a small juice corner with a simple idea: serve real fruit, made in front of you. Fresh juice, thick shakes and cold coffee, with nothing poured from a packet.</p><h2>What we stand for</h2><div class="cards"><div class="card"><h3>100% fresh</h3><p>Fruit squeezed to order.</p></div><div class="card"><h3>Priced for students</h3><p>Great taste at pocket-friendly prices.</p></div><div class="card"><h3>Made your way</h3><p>Less sugar, no ice, extra fruit. Just ask.</p></div></div><p style="margin-top:24px"><a class="btn" href="#/menu">See the menu</a> <a class="btn ghost" href="#/contact">Find us</a></p></section>'},

 h+='<div class="line"><span>'+m.e+' '+m.n+'<br><small>'+l.s+' · '+l.ice+(l.note?' · '+l.note.replace(/</g,"&lt;"):'')+'</small></span><span class="q"><button data-c="'+x+'" data-d="-1" aria-label="Remove one">−</button> '+l.q+' <button data-c="'+x+'" data-d="1" aria-label="Add one">+</button></span></div>'});
 $("count").textContent=n;$("total").textContent=CUR+t;$("lines").innerHTML=h||'<p style="color:var(--muted)">Your order is empty. Add a drink from the menu.</p>';$("send").disabled=!n;$("send").style.opacity=n?1:.5}
document.addEventListener("click",function(e){var el=e.target.closest("[data-add],[data-f],[data-b],[data-s],[data-ice],[data-badd],[data-sur],[data-c]");if(!el)return;var d=el.dataset;
