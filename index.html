var POSTS=[{id:"amla",t:"Amla Juice Benefits: Nutrition, Vitamin C and Why This Traditional Indian Drink Deserves Attention",d:"Nov 2, 2026",s:"Amla, or Indian gooseberry, has a sour, tangy taste and a long place in Indian food culture. Here is what makes it special.",a:3,b:6,x:"<p>Amla, also known as Indian gooseberry, has been a familiar part of traditional Indian food culture for generations. Known for its distinctive sour and tangy taste, this small green fruit is widely appreciated for its nutritional properties.</p><p>Today, amla juice is becoming a popular choice among people looking for refreshing fruit-based beverages. But what makes it special? Let’s explore the major amla juice benefits, its nutritional value and why you might consider including it in a balanced diet.</p><h2>1. A natural source of vitamin C</h2><p>One of the most recognised amla juice benefits is its vitamin C content. Vitamin C is an essential nutrient that supports normal immune function, contributes to collagen formation and helps protect cells from oxidative stress.</p><p>Amla is naturally rich in vitamin C, although the amount in a glass of juice can vary depending on the fruit, preparation and storage method.</p><h2>2. Contains antioxidant compounds</h2><p>Amla contains naturally occurring plant compounds, including polyphenols, which contribute to its antioxidant properties. Antioxidants help protect cells from oxidative damage. Including a variety of fruits and vegetables in your diet is one way to obtain different beneficial plant compounds.</p><h2>3. A refreshing addition to your daily routine</h2><p>Amla juice has a distinctive sour and tangy flavour that makes it different from conventional fruit juices. It can be enjoyed as an occasional refreshing beverage, particularly by people who appreciate traditional Indian fruit flavours. You can also combine amla with other ingredients, depending on your taste preferences.</p><h2>4. Amla juice and its nutritional value</h2><p>Amla is known for containing several naturally occurring nutrients and plant compounds. Its nutritional profile includes:</p><ul><li><b>Vitamin C:</b> supports normal immune function and collagen formation.</li><li><b>Polyphenols:</b> naturally occurring antioxidant compounds.</li><li><b>Other plant nutrients:</b> contribute to the fruit’s nutritional profile.</li></ul><p>The actual nutritional composition of prepared amla juice depends on the quantity of fruit used, dilution and preparation method.</p><h2>5. Why freshly prepared amla juice is worth trying</h2><p>Freshly prepared amla juice allows you to enjoy the distinctive flavour of Indian gooseberry. Some reasons to try it include:</p><ul><li>A naturally tangy and refreshing taste.</li><li>A fruit-based alternative to heavily sweetened beverages.</li><li>An opportunity to explore traditional Indian ingredients.</li><li>A different flavour option alongside conventional fruit juices.</li></ul><p>Remember that whole amla also provides dietary fibre, which may be reduced when the fruit is juiced and strained.</p><h2>6. How can you enjoy amla juice?</h2><p>If you are new to amla juice, its sour flavour may take some getting used to. Here are a few ways to enjoy it:</p><ul><li>Drink it in a diluted preparation if you find the flavour too strong.</li><li>Combine it with other fruit ingredients for a different taste.</li><li>Enjoy it as part of a varied and balanced diet.</li></ul><p>There is no need to consume excessive quantities to enjoy its flavour and nutritional qualities.</p><h2>Conclusion: discover the goodness of Indian gooseberry</h2><p>Amla is a traditional Indian fruit with an interesting nutritional profile and a distinctive taste. From its vitamin C content to its naturally occurring antioxidant compounds, there are several reasons why it continues to attract attention.</p><p>At Azad Juice Corner, we believe that exploring different fruit flavours can make everyday refreshments more interesting. Looking to try something different from your regular orange or watermelon juice? Visit Azad Juice Corner near Amity University Punjab and explore the refreshing taste of amla juice!</p>"},{id:"orange",t:"Orange Juice Benefits: Nutrition, Vitamin C and Why Fresh Orange Juice Is Worth Trying",d:"Nov 2, 2026",s:"Loved for its sweet, tangy taste, orange juice is more than a refreshing drink. Here is what is in the glass.",a:0,b:4,x:"<p>Orange juice is one of the most popular fruit-based beverages, loved for its refreshing taste and natural citrus flavour. Whether enjoyed during breakfast, after a busy day or as a refreshing drink during summer, orange juice offers more than just great taste.</p><p>But what exactly makes orange juice a popular choice? Let’s explore the major orange juice benefits, its nutritional value and why freshly prepared orange juice can be a refreshing addition to your daily routine.</p><h2>1. A natural source of vitamin C</h2><p>One of the most recognised orange juice benefits is its vitamin C content. Vitamin C is an essential nutrient that supports normal immune system function and helps the body produce collagen. Including vitamin C-containing foods and beverages as part of a balanced diet can contribute to meeting daily nutritional requirements.</p><h2>2. Contains important nutrients</h2><p>Orange juice contains several nutrients, including:</p><ul><li><b>Vitamin C:</b> supports normal immune function and collagen production.</li><li><b>Potassium:</b> helps maintain normal muscle and nerve function.</li><li><b>Folate:</b> plays an important role in normal cell growth and development.</li><li><b>Natural carbohydrates:</b> provide energy to the body.</li></ul><p>The exact nutritional composition depends on the oranges used and the preparation method.</p><h2>3. A refreshing way to enjoy fruit flavours</h2><p>Sometimes, all you need is a refreshing drink to make your day better. Fresh orange juice offers a naturally sweet and tangy flavour that makes it a popular choice, especially during warmer months. It can be enjoyed as a refreshing beverage alongside a balanced meal or as an occasional alternative to heavily sweetened drinks.</p><h2>4. Fresh orange juice vs packaged orange juice</h2><p>Have you ever wondered whether fresh orange juice and packaged orange juice are the same? Although both can provide nutrients, they may differ in preparation, processing, ingredients and nutritional composition.</p><p>Freshly prepared orange juice is generally made directly from oranges, while packaged varieties may undergo processing and may contain added ingredients depending on the product. Always check the nutrition label when purchasing packaged juice.</p><h2>5. Why choose freshly prepared orange juice?</h2><p>Freshly prepared orange juice offers a simple way to enjoy the natural taste of oranges. Some reasons people prefer it include:</p><ul><li>Freshly prepared ingredients.</li><li>Naturally refreshing citrus flavour.</li><li>No need for complicated preparation at home.</li><li>An enjoyable beverage option during busy days.</li></ul><p>Remember that whole oranges also provide dietary fibre, particularly when compared with strained juice. Juice is best enjoyed in moderation as part of a balanced diet.</p><h2>Conclusion: make your day a little fresher</h2><p>Orange juice is more than just a refreshing beverage. It contains essential nutrients, offers a delicious citrus flavour and can be enjoyed as part of a balanced lifestyle.</p><p>At Azad Juice Corner, we believe that enjoying fresh fruit beverages should be simple, refreshing and accessible. The next time you feel like enjoying something fruity and refreshing, give freshly prepared orange juice a try! Visit Azad Juice Corner near Amity University Punjab and enjoy a refreshing glass of orange juice.</p>"},
{id:"fresh",t:"Why fresh-pressed beats the packet",d:"Oct 12, 2026",s:"Packaged juice often sits for weeks. Ours is pressed minutes before you drink it.",a:0,b:5,x:"<p>Heat and storage reduce the vitamin C in juice over time, and many packs add sugar or concentrate. At the corner we press each glass to order, so the colour and flavour you see is the fruit itself.</p><h2>Ask for it your way</h2><p>If you like it sweeter, ask us for a little honey instead of sugar. If you like it colder, ask for extra ice. You can set sugar and ice for any drink on the menu.</p><h2>A note on water</h2><p>Juice is a treat, not a replacement for water. Keep a bottle with you and enjoy a glass in between.</p>"},
{id:"whole",t:"Juice or whole fruit?",d:"Sep 28, 2026",s:"Juice is a good treat, but whole fruit keeps the fibre. Here is how we think about it.",a:1,b:6,x:"<p>Fibre slows how fast sugar reaches your blood, so whole fruit is the steadier choice. Juice still gives you vitamins and hydration.</p><h2>A sensible habit</h2><p>One small glass with a meal or between classes works well for most people. If you want the fibre, ask for a mixed fruit option or eat a whole fruit on the side.</p><h2>Pick by mood</h2><p>Citrus for something sharp, mango or banana for something creamy, sugarcane for something cooling.</p>"}];

home:function(){var gs=[[G1,0,"Squeezed to order."],[G2,7,"Thick, cold and creamy."],[G3,6,"Greens, carrot and beet."]];
return '<div class="hero"><div><h1>Juice that tastes like <em>real fruit.</em></h1><p>Pressed fresh at the corner opposite Amity’s Gate 2. Pick a fruit and see what’s in the glass today.</p><div class="acts"><a class="btn" href="#/menu">Order now</a><a class="btn ghost" target="_blank" rel="noopener" href="'+MAP+'">Get directions</a></div></div><div class="stage"><div class="blob" id="blob"><span class="fl" aria-hidden="true">🍋</span><span class="fl" aria-hidden="true">🍓</span><span class="fl" aria-hidden="true">🍊</span><span id="hg"></span><img class="ph" src="'+IMG+'hero.jpg" alt="Fresh fruit juice" style="border-radius:50%"></div><div class="pick" id="picker" role="group" aria-label="Pick a fruit">'+FR.map(function(x,k){return '<button data-f="'+k+'" aria-label="'+M[x].n+'">'+M[x].e+'</button>'}).join("")+'</div><div class="cap"><b id="fname"></b><span id="fnote"></span></div></div></div>'
+'<section><h2>Pick your kind of fresh</h2><div class="cats" style="margin-top:20px">'+gs.map(function(c){return '<a class="cat" href="#/menu" data-tab="'+c[0]+'">'+pic(c[1])+'<h3>'+c[0]+'</h3><p>'+c[2]+'</p></a>'}).join("")+'</div></section>'
+'<section><h2>Fan favourites</h2><p class="sub">Tap any drink to see what’s inside and make it yours.</p><div class="grid">'+FAV.map(item).join("")+'</div></section>'
+'<section><div class="feat"><div><span>🍊</span><h3>Pressed to order</h3><p>Real fruit, squeezed when you ask.</p></div><div><span>🎛️</span><h3>Made your way</h3><p>Less sugar, no ice, extra fruit. Just ask.</p></div><div><span>📍</span><h3>Right at Gate 2</h3><p>Opposite Amity University, Mohali.</p></div></div></section>'
+'<section><h2>From the blog</h2><div class="bcards" style="margin-top:20px">'+POSTS.slice(0,3).map(function(p){return '<a class="bc" href="#/blog-'+p.id+'">'+cover(p.a,p.b,'blog-'+p.id)+'<h3>'+p.t+'</h3><p>'+p.s+'</p></a>'}).join("")+'</div></section>'},
menu:function(){var gs=["All"];M.forEach(function(m){if(gs.indexOf(m.g)<0)gs.push(m.g)});
return '<section><h1 class="pg">Freshly made, every glass</h1><p class="sub">Tap a drink to see its picture, ingredients and vitamins, then customise it.</p><div class="tabs">'+gs.map(function(g){return '<button class="chip" data-tab="'+g+'" aria-pressed="'+(g===FILTER)+'">'+g+'</button>'}).join("")+'<button class="chip" data-sur="1">🎲 Surprise me</button></div><div class="grid">'+M.map(function(m,i){return FILTER==="All"||m.g===FILTER?item(i):""}).join("")+'</div></section>'},
about:function(){return '<section><div class="panel"><div><h1 class="pg" style="font-size:clamp(34px,6vw,54px)">A regular stop at Amity’s gate</h1><p>Right opposite Gate 2, Azad Juice Corner is where you stop for a cold glass between classes.</p><div class="acts" style="margin-top:14px"><a class="btn" href="#/menu">See the menu</a><a class="btn ghost" href="#/contact">Find us</a></div></div><div class="pnl">'+glass(M[0])+glass(M[7])+glass(M[6])+'</div></div></section><section class="art"><h2>Our story</h2><p>We are a small juice corner with a simple idea: serve real fruit, made in front of you. Fresh juice, thick shakes and cold coffee, with nothing poured from a packet.</p></section><section><div class="feat"><div><span>🍉</span><h3>100% fresh</h3><p>Fruit squeezed to order.</p></div><div><span>🎓</span><h3>Student-friendly</h3><p>Great taste at pocket-friendly prices.</p></div><div><span>🧊</span><h3>Your way</h3><p>Less sugar, no ice, extra fruit.</p></div></div></section>'},
blog:function(){return '<section><h1 class="pg">From the juice corner</h1><p class="sub">Simple reads about what goes into your glass.</p><div class="bcards">'+POSTS.map(function(p){return '<a class="bc" href="#/blog-'+p.id+'">'+cover(p.a,p.b,'blog-'+p.id)+'<small style="margin:10px 6px 0;display:block;color:var(--muted)">'+p.d+'</small><h3 style="margin-top:4px">'+p.t+'</h3><p>'+p.s+'</p></a>'}).join("")+'</div></section>'},
gallery:function(){var c=["Fresh and cold","Mango season","Pink and fruity","Green Glow","Coffee break","Squeezed to order","Ruby red","A glass for the road"],ix=[0,7,9,6,11,0,2,1];
return '<section><h1 class="pg">A taste of the counter</h1><p class="sub">Fresh fruit, cold glasses and the corner opposite Amity’s gate.</p><div class="gal">'+ix.map(function(x,k){return '<figure>'+pic(x,"gallery-"+(k+1))+'<figcaption>'+c[k]+'</figcaption></figure>'}).join("")+'</div></section>'},
contact:function(){return '<section><h1 class="pg">Find us</h1><p class="sub">Walk up, grab a glass, stay a while.</p><div class="info"><div><b>Address</b>'+ADDR+'</div><div><b>Timings</b>'+HOURS+'</div><div><b>Call or WhatsApp</b><a href="tel:+91'+PHONE+'">'+PHONE+'</a></div></div><div class="acts"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+WA+'">Chat on WhatsApp</a><a class="btn ghost" target="_blank" rel="noopener" href="'+MAP+'">Get directions</a></div></section>'}};
POSTS.forEach(function(p){V["blog-"+p.id]=function(){return '<section class="art"><p><a href="#/blog">← Back to blog</a></p><h1 class="pg">'+p.t+'</h1><p class="sub">'+p.d+'</p>'+cover(p.a,p.b,'blog-'+p.id)+p.x+'<p><a class="btn" href="#/menu">See our menu</a></p></section>'}});
function fruit(k){FI=k;var m=M[FR[k]];$("blob").style.background=m.a+"22";$("hg").innerHTML=glass(m);$("hg").firstChild.classList.add("pop");$("fname").textContent=m.n;$("fnote").textContent=m.d;
 var b=$("picker").children;for(var j=0;j<b.length;j++)b[j].setAttribute("aria-pressed",j===k)}
function route(){var h=location.hash.replace("#/","")||"home",f=V[h]?h:"home";$("view").innerHTML=V[f]();window.scrollTo(0,0);
 var a=$("links").children;for(var k=0;k<a.length;k++){var on=a[k].getAttribute("href")==="#/"+(f.indexOf("blog-")===0?"blog":f);if(on)a[k].setAttribute("aria-current","page");else a[k].removeAttribute("aria-current")}
 if(f==="home")fruit(FI)}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},1600)}
function add(i,s,ice){var k=i+"|"+s+"|"+ice,f=cart.filter(function(x){return x.k===k})[0];if(f)f.q++;else cart.push({k:k,i:i,s:s,ice:ice,q:1});upd();toast(M[i].n+" added")}
function upd(){var n=0,t=0,h="";cart.forEach(function(l,x){var m=M[l.i];n+=l.q;t+=l.q*m.p;
 h+='<div class="line"><span>'+m.e+' '+m.n+'<br><small>'+l.s+' · '+l.ice+'</small></span><span class="q"><button data-c="'+x+'" data-d="-1" aria-label="Remove one">−</button> '+l.q+' <button data-c="'+x+'" data-d="1" aria-label="Add one">+</button></span></div>'});
 $("count").textContent=n;$("total").textContent=CUR+t;$("lines").innerHTML=h||'<p style="color:var(--muted)">Your order is empty. Add a drink from the menu.</p>';$("send").disabled=!n;$("send").style.opacity=n?1:.5}
function prod(){var m=M[P.i];$("pbody").innerHTML=pic(P.i)+'<h2>'+m.n+'</h2><p style="margin:4px 0;color:var(--muted)">'+m.d+'</p><div class="price">'+CUR+m.p+'</div><div class="lb">What’s inside</div><div class="chips">'+m.i.map(function(x){return '<span class="chip" style="background:var(--soft);border-color:var(--soft)">'+x+'</span>'}).join("")+'</div><div class="vit">💚 '+m.v+'</div><div class="lb">Sugar</div><div class="chips">'+chips(SG,"data-ps",P.s)+'</div><div class="lb">Ice</div><div class="chips">'+chips(IC,"data-pi",P.ice)+'</div><div class="orow"><button class="btn" data-padd="1">Add to order</button><button data-pclose="1" style="background:none;border:0;color:var(--muted)">Close</button></div>'}
function openP(i){P={i:i,s:"Regular",ice:"Regular"};prod();$("pdlg").showModal()}
document.addEventListener("click",function(e){var el=e.target.closest("[data-add],[data-open],[data-f],[data-tab],[data-sur],[data-c],[data-ps],[data-pi],[data-padd],[data-pclose]");if(!el)return;var d=el.dataset;
 if(d.add!==undefined)add(+d.add,"Regular","Regular");
 else if(d.open!==undefined)openP(+d.open);
 else if(d.f!==undefined)fruit(+d.f);
 else if(d.tab!==undefined){FILTER=d.tab;if(el.tagName==="BUTTON")$("view").innerHTML=V.menu()}
 else if(d.sur!==undefined)openP(Math.floor(Math.random()*M.length));
 else if(d.ps!==undefined){P.s=SG[+d.ps];prod()}
 else if(d.pi!==undefined){P.ice=IC[+d.pi];prod()}
 else if(d.padd!==undefined){add(P.i,P.s,P.ice);$("pdlg").close()}
 else if(d.pclose!==undefined)$("pdlg").close();
 else if(d.c!==undefined){var l=cart[+d.c];l.q+=+d.d;if(l.q<1)cart.splice(+d.c,1);upd()}});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.open!==undefined)openP(+e.target.dataset.open)});
document.addEventListener("error",function(e){if(e.target.tagName==="IMG")e.target.remove()},true);
$("cartBtn").onclick=function(){upd();$("dlg").showModal()};$("close").onclick=function(){$("dlg").close()};
$("send").onclick=function(){var nm=$("cname").value.trim(),t="Hi Azad Juice Corner, "+(nm?"this is "+nm+". ":"")+"I’d like to order:\n",tot=0;
 cart.forEach(function(l){t+=l.q+" x "+M[l.i].n+" ("+l.s+", "+l.ice+")\n";tot+=l.q*M[l.i].p});
 window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(t+"Total: "+CUR+tot),"_blank")};
$("logo").innerHTML=glass(M[0])+"Azad Juice Corner";$("yr").textContent=new Date().getFullYear();$("addr").textContent=ADDR;
window.addEventListener("hashchange",route);route();upd();
</script>
</body>
</html>
